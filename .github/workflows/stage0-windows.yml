name: Stage 0 Windows verification

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "backend/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "tailwind.config.cjs"
      - "postcss.config.cjs"
      - "index.html"
      - ".github/workflows/stage0-windows.yml"
  pull_request:
    paths:
      - "apps/**"
      - "backend/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "tailwind.config.cjs"
      - "postcss.config.cjs"
      - "index.html"
      - ".github/workflows/stage0-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-stage0:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Create Python virtualenv
        run: python -m venv .venv
      - name: Install Python dependencies
        run: .venv\Scripts\python.exe -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Check Electron entry points
        run: |
          node --check apps/desktop/main.cjs
          node --check apps/desktop/preload.cjs
      - name: Run backend tests
        run: .venv\Scripts\python.exe -m pytest backend/tests
      - name: Check frontend types
        run: npm run typecheck
      - name: Build Windows installer
        run: npm run package:win
      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "*.exe" -File
          if (-not $installer) { throw "Expected a Windows installer in release." }
          $installer | Select-Object Name, Length
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Ryan_DAM-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
